99mTc diethylene triamine pentaacetic acid (DTPA) is useful in clinical practice.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> When using 99mTc pertechnetate, perchlorate must be given beforehand.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Imaging should be commenced 1-2 hours following injection.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Single photon emission computed tomography (SPECT) is mandatory when 99mTc HMPAO is used.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - 99mTc HMPAO is a lipophilic radiopharmaceutical which does cross the blood-brain barrier.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The three principal radiopharmaceuticals used for brain imaging are 99mTc DTPA, 99mTc pertechnetate<br>and 99mTc glucoheptonate.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Pertechnetate is the cheapest of the three radiopharmaceuticals, but has the disadvantage that it is the<br>only one to accumulate in the choroid plexus, thyroid and salivary glands. This is prevented by the<br>administration of perchlorate 30-45 minutes before the investigation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The dynamic phase is imaged immediately following the injection of isotope, and the static images are<br>taken 1-2 hours post injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Anatomical detail is better displayed using SPECT at any time from 2 minutes to 8 hours after injection.<\/div>","due":39},{"section":"Exam 9","front":"<div class=\"number\">61<\/div><div class=\"stem\">Recognized complications of diagnostic angiography include:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Retroperitoneal haemorrhage following transfemoral puncture.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Brachial plexus injury.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Arteriovenous fistula formation.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Cholesterol embolization.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Bacterial endocarditis.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Transfemoral puncture may also be complicated by haematoma formation in the femoral sheath,<br>subperitoneal and intraperitoneal spaces, scrotum and fascial planes of the thigh.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - This may complicate axillary artery puncture. It occurs either due to primary nerve injury or secondary to<br>extrinsic compression of the brachial plexus by haematoma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Other complications local to the puncture site include arterial thrombus and spasm, subintimal dissection,<br>sepsis, false aneurysm and perivascular extravasation of contrast medium.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Other complications remote from the puncture site include subintimal dissection, arterial thrombosis and<br>spasm, embolisation, catheter knotting, guide wire fracture and septicaemia.<\/div>","due":40},{"section":"Exam 10","front":"<div class=\"number\">81<\/div><div class=\"stem\">In transrectal prostatic ultrasound:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The reflective peripheral zone constitutes the major part of the normal gland.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Patients are examined prone.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> An anal stricture is a contraindication.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> No bowel preparation is required.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The seminal vesicles are highly echogenic.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - The peripheral zone constitutes 70% of the normal gland. It is more reflective than the remaining<br>transitional and central zones of the gland.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Patients are examined in the left lateral position.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The seminal vesicles are echopoor with fine internal echoes.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">82<\/div><div class=\"stem\">Regarding interventional techniques in ultrasound:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The transducer should be sterilized by autoclaving following ultrasound guided puncture and biopsy.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Needle position within the tissues is demonstrated by the highly echogenic needle shaft.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Fine needle biopsy is safely performed on an outpatient basis.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Local anaesthesia is necessary prior to transrectal guided biopsy of the prostate gland.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Prophylactic intravenous antibiotics are recommended prior to trans-rectal guided biopsy of the prostate gland.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Ultrasound transducers do not tolerate autoclaving. Sterility is achieved by the use of sterile rubber<br>coverings for the transducer or by immersion of the equipment in cleaning fluids.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - A needle shaft within tissues is poorly visualised under ultrasound guidance. However, the needle tip is<br>usually well visualised as a strong echo.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - No local anaesthesia is required.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Prophylactic intravenous antibiotics should be given immediately before, and subsequently orally for 3<br>days post-biopsy.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">83<\/div><div class=\"stem\">In Doppler ultrasound:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Continuous wave Doppler may be used in fetal heart detection.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Blood flow within the popliteal vein can be augmented by manual calf compression.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The portal vein is best assessed via an anterior approach.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The normal velocity waveform of the common carotid artery shows continuous forward flow in diastole.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The normal velocity waveform of the external carotid artery may show reversal in diastole.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - This manoeuvre is useful in examination of the deep veins of the leg where normal low velocity blood flow<br>may not otherwise be detected. The Valsalva manoeuvre is also followed by a compensatory transient<br>increase in blood flow in the deep veins of the leg.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - An anterior approach to the portal vein is optimal for imaging but provides a poor beam/vessel angle for<br>Doppler studies. In Doppler ultrasound the beam/vessel angle should be no greater than 60°. Therefore,<br>the right lateral intercostal approach optimises the beam/vessel angle.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This is characteristic of a low resistance arterial flow pattern.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span>- This is characteristic of a high resistance arterial flow pattern.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">84<\/div><div class=\"stem\">With respect to Doppler imaging of the leg veins:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The normal venous flow signal in the legs varies with respiration.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Compressibility of veins is one of the most reliable signs of patency.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> An established collateral venous system may simulate flow in a patent major vein.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Doppler flow studies are more reliable in detecting thrombus in the veins below the knee than in those above the knee.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Thrombus may be anechoic.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - When the patient lies supine, the venous flow signal decreases on inspiration and increases on expiration.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Direct pressure with the ultrasound probe over the vein will cause the normal vein to collapse. If thrombus<br>is present, this will not occur.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Thus causing confusion and inaccuracy.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Duplex Doppler studies have a high degree of accuracy in detecting occlusions in the femoral, popliteal or<br>iliac veins. Below the knee the study is difficult, time consuming and less reliable.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Thus compression studies are important.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">85<\/div><div class=\"stem\">In chest computed tomography (CT):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The vagus nerves are commonly visualised.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The mediastinal structures are best demonstrated with a narrow window width.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The normal pericardium is not visible.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Normal mediastinal lymph nodes are not visualised.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The major fissures are demonstrated as thin white lines in the majority of cases.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - A narrow window width (e.g. 300 Hounsfield units) and a soft-tissue level (e.g. 30-50 Hounsfield units) are optimal.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The normal pericardium is visible as a thin stripe of soft tissue density around the heart outlined by<br>mediastinal and epicardial fat.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Normal mediastinal lymph nodes may be visualised. A diameter of 1 cm is considered as the upper limit of<br>a normal node in most parts of the mediastinum.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The major fissures are demonstrated as thin white lines in only 10-20% of CT scans. However their<br>position can be inferred from the relatively avascular plane of lung lying either side of each fissure.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">86<\/div><div class=\"stem\">When the thorax is examined by high-resolution CT:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Contiguous 1 mm thick sections are usually obtained.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The mA is usually increased compared with conventional chest CT.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Normal interlobular septa may be visible.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A soft tissue algorithm is used.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Motion artefact adjacent to the heart is eliminated.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - 1 mm thick sections are usually obtained at intervals from the lung apices to bases.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Increasing mA reduces the visible image noise and improves scan quality.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Normal centrilobular arteries may also be visible. The centrilobular bronchiole is not normally seen.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - A bony algorithm is used in high-resolution CT.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">87<\/div><div class=\"stem\">Regarding percutaneous lung biopsy:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A previous contralateral pneumonectomy is a contraindication.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A pneumothorax will be detectable on a chest radiograph in approximately 60% of cases.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The risk of pneumothorax is increased if the biopsy needle traverses a fissure.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> In the case of a large or cavitating lesion it is important to obtain material from its margins.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A CT scan is required in all cases to accurately locate the lesion.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Because a pneumothorax would be poorly tolerated.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - A chest radiograph demonstrates a pneumothorax in 15-25% of cases. CT shows a much higher<br>percentage (about 60%).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - The biopsy needle will be traversing four layers of pleura.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - The cells in the centre of the lesion may be necrotic and unrepresentative of its true cytological nature.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The lesion can often be adequately detected using biplane fluoroscopy or a C-arm.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">88<\/div><div class=\"stem\">In CT scanning of the upper abdomen:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The normal spleen enhances irregularly following bolus intravenous contrast agents.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The normal gastric wall can be 10 mm thick.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Pancreatic examination may require a left lateral decubitus position<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Adrenal glands are visualised in approximately 10% of normal patients.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The gall bladder wall enhances markedly following intravenous contrast enhancement.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Due to variable rates of blood flow through its pulp.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The normal small bowel wall is up to 3 mm thick. The normal colonic wall is up to 5 mm thick.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - In pancreatic CT examination a right lateral decubitus position immediately after oral contrast medium<br>may be helpful in opacifying the duodenum.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Adrenal glands are visualised in almost all normal adults.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">89<\/div><div class=\"stem\">In CT of the abdomen:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Dilute barium can be used to opacify the bowel.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Normal intrahepatic bile ducts are usually visible.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Oral contrast medium should be given 1 hour prior to the examination to produce large bowel opacification.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The diaphragmatic crura can be mistaken for enlarged lymph nodes.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Image interpretation is easier in thin rather than obese patients.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Barium concentrations between 1-3% w/v are optimal.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Normal intrahepatic bile ducts are not usually visible on CT.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Oral contrast medium should be given at least 4 hours prior to the examination to produce large bowel<br>opacification. Oral contrast medium should be given gradually over a period of 1 hour before scanning to<br>produce small bowel opacification.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Much of the natural contrast in CT is provided by fat, thus making image interpretation easier in obese patients.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">90<\/div><div class=\"stem\">In CT of the normal pelvis:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Vaginal tampons should always be removed prior to scanning to avoid confusing artefacts.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The ovaries are readily identified<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The paired seminal vesicles have a characteristic bowtie shaped appearance.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The spermatic cord is visualized in the inguinal canal.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The prostate is separated from the bladder by a fat plane.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - A vaginal tampon is indicated in pelvic scanning. Air trapped by the tampon produces negative contrast.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - They are difficult to identify on CT.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - It is seen as a thin-walled oval structure of fat density containing small dots representing the vas deferens<br>and spermatic vessels.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">91<\/div><div class=\"stem\">Regarding computed tomography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Suspended respiration is required for examination of the neck.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Air is seen within the oesophagus in approximately 80% of patients on chest CT.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Filling defects may be seen in the normal superior vena cava during contrast enhancement.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> CT pelvimetry has a much lower radiation dose than conventional pelvimetry.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Patients undergoing a pelvic examination should have a full bladder.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Suspended respiration is not required. However, the patient should be asked not to swallow during the<br>exposure.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Filling defects in the superior vena cava result from incomplete mixing of opacified and unopacified blood.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - CT pelvimetry measurements are also accurate and reproducible.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">92<\/div><div class=\"stem\">In CT examination of the brain:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Most adults' heads are adequately examined in approximately 15 contiguous 10 mm thick axial sections.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> When scanning the posterior cranial fossa bony artefact is reduced by increasing slice thickness.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Intravenous contrast enhancement should precede pituitary fossa examination.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> White matter is more dense than grey matter<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The internal capsule is of a higher attenuation value than the caudate nuclei.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - 10 mm thick contiguous sections from the posterior arch of the atlas to the vertex.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - When scanning the posterior cranial fossa, thinner and more frequent sections will reduce bone artefacts<br>and improve scan quality. Alteration in gantry angulation may also reduce artefact.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - White matter is less dense (i.e. has a lower Hounsfield number) than grey matter.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The internal capsule is of a lower attenuation value than the caudate nuclei.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">93<\/div><div class=\"stem\">In CT scanning of the orbits:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The superior ophthalmic vein cannot be distinguished separately from the superior rectus muscle.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Direct coronal sections are often necessary.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Intravenous contrast enhancement is mandatory.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Axial sections are acquired parallel to the neuro-ocular plane.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The prone patient position is essential when obtaining direct coronal sections.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - In addition to axial sections. Coronal reformats should be reserved for those patients whose dental fillings<br>make direct coronal sections difficult.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Intravenous contrast enhancement is generally given to show up space-occupying lesions in better detail<br>or when there is suspicion of intracranial involvement by a lesion. It is not necessary in thyroid eye<br>disease nor following trauma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - To obtain direct coronal sections the patient usually lies prone with the chin elevated. However, if this is<br>not possible, then direct coronal sections may be obtained by placing the patient supine with the neck<br>hyperextended.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">94<\/div><div class=\"stem\">When imaging the larynx:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Lateral tomograms give a better demonstration of the vocal cords than anteroposterior (AP) tomograms.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Phonating “ee\" approximates the vocal cords.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Axial CT sections of 5 mm thickness are technically appropriate.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Ossification of the laryngeal cartilages is more easily seen on the frontal radiograph than the lateral radiograph.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Soft tissue discrimination is better on MRI than CT.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The vocal cords are best seen on AP tomograms.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Laryngeal cartilage ossification is best seen on the lateral radiograph which avoids superimposition of<br>cartilage over spine.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - In addition, the use of coronal and sagittal sections in MRI allows visualisation of the intrinsic laryngeal muscles.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">95<\/div><div class=\"stem\">Dimeglumine gadopentate (Gadolinium):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Is super-paramagnetic.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Shortens the T1-relaxation time.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Is excreted by the kidneys.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Produces a transient increase in serum iron levels following intravenous injection.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Has no severe adverse effects.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Gadolinium is a paramagnetic contrast agent.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Gadolinium leads to an increased signal on T1 -weighted MR images and is therefore known as a positive<br>contrast agent. Superparamagnetic contrast agents reduce the T2-relaxation time, leading to a decreased<br>signal on T2-weighted images. They are known as negative contrast agents.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - It has a plasma half-life of about 90 minutes.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Therefore serum iron estimations may be inaccurate in the 24 hours following intravenous injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Gadolinium may result in an anaphylactoid reaction. Minor reactions are seen in about 0.14% patients<br>following injection; these include nausea, local burning sensation, urticaria and headache.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">96<\/div><div class=\"stem\">Regarding spin echo imaging:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Structures with a short T1 produce high signal intensity in T1-weighted images.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Structures with a short T2 produce high signal intensity in T2-weighted images.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Fat produces a higher signal intensity than muscle on a T1 weighted image.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Cerebrospinal fluid usually produces a lower signal intensity than grey matter on a T2-weighted image<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Cortical bone has a high signal intensity on T1- and T2-weighted images.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Structures with a long T1 produce low signal intensity on T1-weighted images.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Structures with a long T2 produce high signal intensity on T2-weighted images. Structures with short T2<br>produce low signal intensity on T2-weighted images.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Fat has a shorter T1 than muscle.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Cerebrospinal fluid usually has a longer T2 than grey matter.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Cortical bone has a low signal intensity on T1- and T2-weighted images.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">97<\/div><div class=\"stem\">Regarding MRI of the brain:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The pituitary gland enhances poorly with intravenous Gadolinium.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Mascara should be removed prior to the examination.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The paranasal sinus mucosa enhances with intravenous Gadolinium.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> On T1-weighted images grey matter has a higher signal intensity than white matter.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> On T2 weighted images white matter has a brighter signal than grey matter.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - It enhances strongly.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Mascara may contain ferromagnetic material and thus cause signal loss/geometric distortion.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The reverse is true.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The reverse is true.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">98<\/div><div class=\"stem\">A significant deflection (rotational movement as a result of the primary field) of the<br>following implants/devices will occur during MRI:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Charnley total hip replacement prosthesis.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Björk Shiley heart valve replacement.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Copper intra uterine contraceptive device.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Dental amalgam.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> All surgical clips.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Most orthopaedic implants do not undergo significant deflection and are therefore safe.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Many modern prosthetic heart valves are submitted to a deflection force which is not clinically significant.<br>However, some prosthetic valves, including the Starr-Edwards valve, may undergo significant deflection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Whether a surgical clip undergoes significant deflection or not depends on the individual type of clip.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">99<\/div><div class=\"stem\">The following statements regarding MRI are true:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The entire scanning suite is designated a controlled area.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The noise heard during scanning arises from the transmitted radiofrequency pulses.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 60% w/v barium is used as a positive bowel contrast agent.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Gadolinium enhancement helps to discriminate between recurrent intervertebral disc prolapse and<br>postoperative Fibrosis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Cardiac gating improves image quality in examination of the cervical spine.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The area inside the 10 Gauss line is designated as controlled. Any person entering the controlled area<br>should remove all loose ferromagnetic objects susceptible to the missile effect, and any magnetic cards.<br>Persons with pacemakers must not enter.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The noise which is heard during scanning arises from vibration in the gradient coils due to the varying<br>magnetic fields.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Barium is used as a negative bowel contrast agent, by shortening T2 and therefore appearing black on T2-<br>weighted spin echo images. Gadolinium and fatty oils are used as positive bowel contrast agents.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Imaging must be performed shortly after intravenous Gadolinium as fibrous tissue enhances immediately<br>but disc material does not enhance within 10 minutes of injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Artefact produced by cerebrospinal fluid pulsation in the cervical spine can be reduced by synchronising<br>data acquisition to the cardiac cycle.<\/div>","due":37},{"section":"Exam 10","front":"<div class=\"number\">100<\/div><div class=\"stem\">In magnetic resonance imaging:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> T1-weighted spin echo (SE) images usually visualize anatomical structures better than T2 weighted SE images.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The signal from fat is suppressed by short T1-Inversion Recovery (STIR) sequences.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Healthy tendons can acquire abnormally high signal on short TE sequences if orientated at 55° to the static<br>magnetic field.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Rapidly flowing blood or cerebrospinal fluid usually has high signal on spin echo sequences<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Regarding magnetic resonance angiography (MRA), the time of flight technique is more sensitive to slow flow<br>than the phase contrast technique.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - T2-weighted spin echo images usually demonstrate pathology better than T1-weighted SE images.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - It is particularly useful in the examination of tissues with a high fat content (e g. orbit, parotid gland, bone<br>marrow).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - This is referred to as the magic angle phenomenon and may mimic pathological tendinous change. The<br>effect is most likely to be seen in curved tendons (e.g. supraspinatus tendon).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - In spin echo sequences, rapidly flowing blood or cerebrospinal fluid usually has low signal. Slow flowing<br>blood usually has high signal. However in gradient echo techniques, virtually all vessels are hyperintense.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The opposite is true. Time of flight (TOF) MRA uses a gradient echo sequence with a flip angle of 30-60° to<br>maximise flow-related enhancement of vessels that occurs due to the entry phenomenon. Thus in-plane<br>flow will produce less signal so that TOF techniques are less sensitive to slow flow within the imaging<br>plane.<\/div>","due":37}];
const section=document.getElementById('section'),search=document.getElementById('search'),front=document.getElementById('front'),back=document.getElementById('back'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let shown=[],i=0;
const sections=[...new Set(cards.map(x=>x.section))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));section.innerHTML='<option value="">كل المجموعات</option>'+sections.map(x=>`<option>${x}</option>`).join('');
function strip(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent.toLowerCase()}
function filter(){const q=search.value.trim().toLowerCase();shown=cards.filter(c=>(!section.value||c.section===section.value)&&(!q||strip(c.front+' '+c.back).includes(q)));i=0;render()}
function render(){if(!shown.length){front.innerHTML='<div class="empty">لا توجد بطاقات مطابقة</div>';back.innerHTML='';counter.textContent='0 / 0';bar.style.width='0%';return}const c=shown[i];front.innerHTML=c.front;back.innerHTML=c.back;back.classList.remove('show');document.getElementById('reveal').textContent='إظهار الإجابة';counter.textContent=`${i+1} / ${shown.length} — ${c.section}`;bar.style.width=`${(i+1)/shown.length*100}%`}
section.onchange=filter;search.oninput=filter;document.getElementById('next').onclick=()=>{if(shown.length){i=(i+1)%shown.length;render()}};document.getElementById('prev').onclick=()=>{if(shown.length){i=(i-1+shown.length)%shown.length;render()}};document.getElementById('reveal').onclick=e=>{back.classList.toggle('show');e.target.textContent=back.classList.contains('show')?'إخفاء الإجابة':'إظهار الإجابة'};document.onkeydown=e=>{if(e.key==='ArrowLeft')document.getElementById('next').click();if(e.key==='ArrowRight')document.getElementById('prev').click();if(e.key===' ') {e.preventDefault();document.getElementById('reveal').click()}};filter();
</script></body></html>
