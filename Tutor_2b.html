0 x 109I<br>-1<br>is a contraindication to the procedure.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A Chiba needle should be inserted through the liver via an anterior approach.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The incidence of complications is primarily related to the number of passes prior to entering a duct.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> If contrast medium is seen in the intrahepatic lymphatics, the procedure should be terminated.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Internal biliary drainage is indicated if ductal calculi are demonstrated.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Other contraindications include an elevated prothrombin time, hydatid disease and severe<br>cardiopulmonary disease.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The Chiba needle (22G) is inserted in the mid-axillary line in the right seventh or eighth intercostal space.<br>It is therefore inserted parallel to the plane of the table and advanced during suspended respiration<br>through the right lobe of the liver.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The incidence of complications is not related to the number of passes. A maximum of 10-20 passes may<br>be performed. The likelihood of success is directly related to the degree of duct dilatation and the<br>number of passes made.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Excessive parenchymal injection may result in lymphatic opacification. This usually clears spontaneously<br>and the procedure can be continued with the needle in a different position.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The presence of ductal calculi is a contraindication to endoprosthesis insertion.<\/div>","due":40},{"section":"Exam 8","front":"<div class=\"number\">41<\/div><div class=\"stem\">In myelography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Lateral cervical puncture should be performed when there is a suspected mass lesion in the upper cervical canal.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Loss dilution of contrast medium occurs if the contrast flows cephalad in the spinal canal via a lumbar puncture<br>than if the contrast flows caudad via a cervical puncture.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Lateral cervical puncture is a recognised method of demonstrating the upper level of a spinal block.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Post-myelogram CT should be delayed for 24 hours after the myelogram to reduce the contrast density by dilution.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Prolonged headache is a more frequent complication in females than in males.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - This is a contraindication to direct cervical puncture. Other contraindications include cerebellar tonsillar<br>herniation, suspected lumbar spinal dysraphism and certain spinal deformities leading to loss of the C1/2<br>interspace.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - A delay is not needed between the myelogram and CT, unless the investigation is for syringomyelia, in<br>which case a 24 hour delay is ideal to show the syrinx.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Post-myelographic headache occurs in 20-30% of patients, and about 10% will have more severe<br>prolonged headaches, particularly females.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">42<\/div><div class=\"stem\">In dacryocystography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A macro-radiography technique is recommended.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> An occipitofrontal 20° control film is taken.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Cannulation of the superior canaliculus is recommended.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 0.5-2.0 ml of Lipiodol ultra-fluid is recommended.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Bilateral rather than unilateral examination is common practice.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Thus magnifying the image obtained.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The control film is an occipitomental film.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The lower canaliculus is usually cannulated preferentially as it is more convenient and functionally more<br>important.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - This enables comparison with the normal side, or, if abnormalities are bilateral (a common finding) the<br>simultaneous demonstration of the two sides.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">43<\/div><div class=\"stem\">In sialography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Lipiodol ultrafluid can be used as a contrast medium.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Pain occurs more readily with a water-soluble contrast medium than with an oil-based agent.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A fine probe should be passed at least 2 cm into the parotid duct.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Contrast medium should be injected into the parotid duct at a rate of approximately 2 ml/min.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> An occlusal radiograph is useful in the evaluation of the parotid duct.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Either a water-soluble contrast medium or the oil-based medium, Lipiodol, can be used in sialography. Oil<br>based media are more viscous and, if accidentally injected into the soft tissues, may remain in situ for<br>many years.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - After passing the probe about 1 cm into the parotid duct, resistance will be met where the duct<br>penetrates the buccinator muscle. The probe should not be advanced any further.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Contrast medium should be injected very slowly at a rate of approximately 0.2 ml/min.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - This view is useful in evaluating the submandibular duct.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">44<\/div><div class=\"stem\">The following statements are true:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The anthropological baseline passes from the outer canthus of the eye to the centre of the external auditory meatus.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> In a standard occipitofrontal projection the beam is angled cephalad.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> In a submentovertical projection the radiographic baseline should be parallel to the film.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Auto-tomography may be usefully employed in the lateral oblique view of the temporomandibular joint.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The coronoid process of the mandible is well shown von a standard occipitomental projection.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - This is a description of the orbitomeatal (or radiographic) baseline. The anthropological baseline passes<br>from the infraorbital point to the upper border of the external auditory meatus. These two lines are at an<br>angle of about 10° to each other.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The beam is angled caudally and centred in the midline above the external occipital protuberance to<br>emerge from the nasion.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - The beam is directed at right angles to the orbitomeatal plane and centred midway between the external<br>auditory meati.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Open and closed mouth views of the temporomandibular joint do not employ patient movement.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">45<\/div><div class=\"stem\">An appropriate radiographic centring point for:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A lateral view of the cervical spine is 2.5 cm posterior to the angle of the mandible.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> An AP view of the shoulder is the acromion.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A frog lateral of the hips is the femoral head.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A PA chest radiograph is T4.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A PA view of the hand is the capitate.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - This is approximately the level of C3.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - For an AP view of the shoulder, the beam should be centred on the coracoid process. For an axial view,<br>the centring point is the acromion.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - A frog lateral view is taken of both hips simultaneously. The hips are flexed, abducted and laterally<br>rotated, and the centring point is in the midline, at the level of the femoral pulse.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - For an AP chest radiograph the appropriate centring point is the sternal notch.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - For a PA view of the hand, the beam should be centred on the head of the third metacarpal.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">46<\/div><div class=\"stem\">Regarding skull radiography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The eye dose is up to 200 times greater with an AP projection than with a PA projection.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A horizontal beam lateral film is essential in the case of head injury.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> In an occipitofrontal (OF) 20 film, the petrous ridges should be projected at or near the superior orbital margins.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A Towne’s view requires 30° cranial angulation of the central ray.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> For a sub-mento-vertical view, the radiographic baseline should be parallel with the film.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Therefore it is desirable to choose a PA projection whenever possible.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - To exclude air/fluid levels in the cranial cavity, the ventricles or the sinuses.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - On an OF 20 radiograph, the petrous ridges should be projected onto the inferior orbital margins, leaving<br>an unobstructed view of the bony orbits.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - A Towne's view is taken with the patient supine, the tube angled 30° caudally and the beam centred on<br>the foramen magnum.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - With the patient supine, the neck is fully hyper-extended until the baseline is parallel to the film. The beam<br>should be centred midway between the angles of the mandible.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">47<\/div><div class=\"stem\">Regarding radiography of the facial bones and teeth<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The zygomatic arches are best demonstrated on the lateral view.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The central ray is angled 30° caudally for the standard occipitomental (OM) view.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> When performing orthopantomography the patient should gently open and close their mouth during the exposure.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The maxillary antra are best shown on the occipitomental (OM) view.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The occlusal plane is a horizontal plane passing through the opposing biting surfaces of the teeth.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The zygomatic arches are visualised on occipitomental projections, but an underpenetrated SMV view<br>gives the clearest demonstration. They may also be seen on a Towne's view collimated to include the<br>zygomatic arches.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - For a basic OM view the central ray is not angled. For an OM 30 it is angled 30° caudally.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The patient should remain stationary. To prevent any movement, most units utilise head clamps, a chin<br>rest and a bite rod.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Together with the frontal sinuses and anterior ethmoids.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">48<\/div><div class=\"stem\">The following statements are true:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Oblique views of the cervical spine are usually performed with the patient supine.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> When taking erect right anterior oblique view of the cervical spine, the median sagittal plane of the head is<br>parallel to the film<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> In AP oblique projection, the cervical intervertebral foramina demonstrated are those on the side nearer the X-ray tube.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A right posterior oblique (RPO) view of the lumbar spine will demonstrate the left pars interarticularis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> For an oblique view of the lumbosacral junction, the patient is rotated approximately 45°.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - These views are most commonly performed with the patient erect.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The median sagittal plane of the trunk is about 45° to the film.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - In a PA oblique projection of the cervical spine, the intervertebral foramina that are seen are those nearer the film<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Oblique views of the lumbar spine show the pars interarticularis on the side to which the patient is turned<br>(e.g. RPO shows the right pars).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">49<\/div><div class=\"stem\">Regarding imaging of the breast:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Compression should not be used during mammography when cysts are suspected.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Ultrasound should be performed with a low frequency (3.5 MHz) transducer.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The standard mammography film series comprises a cranio- caudal view and a straight lateral view of each<br>breast.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The nipple should be seen in profile in the standard mammographic views of the breast.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Ductography involves the injection of 5 ml of a water-soluble contrast medium into a dilated duct.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Ultrasound should be performed with a high frequency, high resolution transducer (5-10 MHz).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The standard series comprises a cranio-caudal and oblique lateral view of each breast.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - 0.5-1 ml of a water-soluble contrast medium should be injected into a duct slowly and the injection<br>terminated when the patient experiences pain.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">50<\/div><div class=\"stem\">Regarding lower limb lymphography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The internal iliac lymph nodes are usually well demonstrated.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> It should not be performed within 6 months of radiotherapy.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Right-to-left crossover of lymphatics is more common than vice versa.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 7 ml Lipiodol ultrafluid should be used for each lower limb at an injection rate of 1 ml/min.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Hepatic oil embolism is a recognised complication.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The internal iliac, mesenteric, retrocrural, splenic and renal hilar nodes are not seen in this investigation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Lymphography should not be performed within 3 weeks of radiotherapy as disruption of the lymph node<br>architecture may allow oily contrast medium to pass into the systemic circulation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Therefore visualisation of both sides is possible if only the right side is injected.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - 7 ml Lipiodol ultrafluid per lower limb should be injected over 45 minutes by a pump injector<br>(approximately 0.2 ml/min).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - This occurs when there is lymphatic obstruction and lymphaticoportal venous communication.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">51<\/div><div class=\"stem\">In ascending venography of the lower limb:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A tourniquet applied above the ankle may occlude the normal anterior tibial vein.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The study is complete when the deep femoral vein has been demonstrated.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A single projection radiograph of the deep calf veins is adequate.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 60 ml iohexol 240 would be a suitable contrast medium.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> At the end of the procedure the needle should always be flushed with normal saline.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - The absence of anterior tibial vein filling by contrast is not therefore always indicative of venous thrombosis.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The deep femoral vein is only opacified in about 50% of cases when there is a loop connection with the<br>superficial femoral vein, or when retrograde filling occurs during the Valsalva manoeuvre.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Radiographs of the deep calf veins should be obtained with the leg in internal and external rotation to<br>avoid superimposition of bones and veins.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - To avoid stasis of contrast medium in the leg leading to phlebitis.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">52<\/div><div class=\"stem\">In superior vena cavography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Contrast medium injection into a single median antecubital vein is usually adequate.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The total volume of contrast medium injected should not exceed 30 ml.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A Valsalva manoeuvre facilitates opacification.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Catheterisation of both subclavian veins is rarely necessary to obtain good opacification.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The normal azygos vein is often opacified.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Contrast medium should be injected into a vein in both arms simultaneously in order to opacify the<br>superior vena cava.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - 30 ml contrast medium should be injected into each arm.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">53<\/div><div class=\"stem\">Regarding portal venography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Indirect portal venography is performed via a trans-splenic approach.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Portal hypertension is a contraindication to the procedure.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> For transplenic approach, 50-60 ml of low-osmolar contrast medium(370 mg iodine/ml) should be injected at<br>8-10ml/sec<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> When using the transplenic approach, larger volume of contrast medium is required in patients with splenomegaly.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> After transhepatic portal venography, a plug of gel-foam should be placed in the catheter track.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Indirect portography results from injecting contrast into the coeliac or superior mesenteric arteries and<br>obtaining delayed films of the portal vein.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Portal venography is indicated to demonstrate the anatomy of the portal system in patients with portal<br>hypertension. Direct percutaneous splenoportography can be used to measure portal venous pressure.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - For transplenic portal venography, there is no need to increase the volume of contrast medium in<br>splenomegaly. However, when performing indirect portography (i.e. late phase coeliac or superior<br>mesenteric angiography) an increased volume of contrast is required in splenomegaly (about 70 ml low-osmolar contrast medium 370 mg iodine/ml at 8 ml/sec).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - This reduces the chance of blood or bile leakage into the peritoneum.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">54<\/div><div class=\"stem\">Regarding intravenous digital subtraction angiography (IVDSA):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The basilic vein is preferred to the cephalic vein as a site of access.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The right atrium is preferred to the superior vena cava as a central site for the catheter tip.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Abdominal compression may be useful when imaging abdominal vessels.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Contrast medium with a lower concentration of iodine per ml than that used in intra-arterial DSA (IADSA) is<br>recommended.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A 15 ml volume delivered centrally at a rate of 10 ml/sec is suitable for each injection of contrast medium.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - It is more difficult to negotiate a catheter through the cephalic vein in the region of the clavipectoral fascia.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The right atrium is the optimal site for contrast injection as it produces good mixing of blood from the<br>superior and inferior vena cavae.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Subtraction errors due to bowel gas movement may be reduced by abdominal compression and<br>intravenous Buscopan.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - IVDSA uses full-strength contrast medium (about 350 mg iodine/ml). IADSA uses contrast medium diluted<br>to about one-third to one-half of the normal concentration.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - A 35 ml volume delivered at a rate of 20 ml/second is suitable.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">55<\/div><div class=\"stem\">Regarding angiographic equipment:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The French size of a catheter is a measure of the circumference of the catheter tip.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Polyethylene catheters are stiffer than polyurethane catheters and this provides better torque control.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Guide wires consist of two inner straight wires with an outer wire coiled around them.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A typical guide wire measures 0.035 inches (0.89 mm) or 0.038 inches (0.97 mm) in diameter.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A typical catheter measures 60-100 cm in length.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Polyurethane catheters are stiffer than polyethylene catheters.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - One inner straight wire runs the whole length of the guide wire to reduce the risk of fracturing. The other<br>inner wire terminates near the end of the guide wire to produce a soft flexible tip; it may be movable for<br>variable stiffness of the tip.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Typical length of a guide wire is 100-150 cm.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Most diagnostic angiography is performed with 4 French or 5 French catheters.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">56<\/div><div class=\"stem\">Regarding angiography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The hole in the vessel wall produced by a 6 French catheter has an area four times larger than that of a 3 French<br>catheter.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Sheaths are sized according to the largest size catheter that they will accommodate.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Single-wall arterial puncture requires a two-part needle.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The catheter tip should be positioned about 5-10 cm above the aortic bifurcation in lumbar aortography.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The most reliable guide to the position of the common femoral A. for percutaneous puncture is the site of<br>maximal pulsation.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - A 3 French catheter produces a hole 1 mm in diameter. A 6 French catheter produces a hole 2 mm in<br>diameter. This represents a four fold increase in area (π x radius2).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Double-wall arterial puncture requires a two-part needle, which consists of a bevelled central stylet and<br>an outer blunt cannula. Single-wall arterial puncture uses a one-part needle with a central bore.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This site lies at the level of L3/4.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">57<\/div><div class=\"stem\">A low-osmolar contrast medium with an iodine concentration of 350 mg/ml delivered at<br>these injection volumes and rates would be appropriate for use in the following conventional arteriographic<br>examinations:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Lumbar aortography: approximately 50 ml volume; rate 8-12 ml/sec.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Superior mesenteric arteriography: approximately 50 ml volume; rate 6-10 ml/sec.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Pulmonary arteriography: approximately 20 ml volume; rate 8-10 ml/sec.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Right coronary arteriography: approximately 15 ml volume; rate 10 ml/sec.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Common carotid arteriography: approximately 12 ml volume; hand injection.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Approximately the same volume and rate of contrast medium injection for coeliac arteriography. Inferior<br>mesenteric arteriography requires about 15 ml volume at rate 3-5 ml/sec.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Pulmonary arteriography requires 40-50 ml volume at rate 20-25 ml/sec.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Right coronary arteriography requires 3-8 ml volume by hand injection. Left coronary arteriography<br>requires 5-10 ml volume by hand injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - A contrast medium iodine concentration of 350 mg/ml is too high for common carotid arteriography.<br>About 12 ml low-osmolar contrast medium with an iodine concentration of not more than 300 mg/ml is<br>suitable. This should be given by hand injection.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">58<\/div><div class=\"stem\">In pulmonary angiography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The catheter tip should be sited at the bifurcation of the pulmonary artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Anteroposterior and lateral projections should be obtained routinely.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Pigtail catheters are not suitable due to risk of rupture of the right ventricular chordae tendinae on withdrawal<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Films which record the arterial, capillary and venous phases should be obtained.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Pulmonary hypertension is a contraindication.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The catheter tip should be sited 1-3 cm above the pulmonary valve, i.e. below the bifurcation of the<br>pulmonary artery.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The anteroposterior projection is adequate. Oblique views may also be useful. A lateral projection is of no<br>value in a main-stem pulmonary artery injection due to superimposition.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Pigtail catheters are most commonly used. Insertion of the guidewire to straighten out the end of the<br>catheter, prior to withdrawal, avoids this complication.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Pulmonary hypertension is an indication for pulmonary arteriography. However, there is increased risk<br>that the procedure may be complicated by cardiorespiratory failure in these circumstances.<\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">59<\/div><div class=\"stem\">In angiocardiography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The right side of the heart is studied via a catheter passed retrogradely from the femoral artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A cine-film frequency of 15 frames per second is usually adequate<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A pigtail catheter is suitable for left ventricular injections.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The right anterior oblique projection will demonstrate the mitral valve satisfactorily.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A rise in the incidence of ectopic beats occurs with increasing contrast injection rates.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The right heart is studied via a catheter passed anterogradely into a peripheral vein. In adults, the left<br>heart is studied via a catheter passed retrogradely from the femoral artery. In children, it is usually<br>possible to manipulate a venous catheter through a patent foramen ovale to examine the left heart.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - About 25-80 frames per second are required.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 8","front":"<div class=\"number\">60<\/div><div class=\"stem\">In coronary arteriography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The Sones technique requires right and left coronary artery catheters<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The tip of the left Judkins' coronary artery catheter is more curved than that of the right.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A 40° caudal-cranial view is ideal for visualisation of the left main-stem coronary artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Coronary arteriography is usually preceded by left ventricular angiography<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Coronary artery dissection is not usually clinically significant.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The Sones technique uses a single catheter via a brachial arteriotomy.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - To aid engagement of the coronary ostia by the catheters.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Left ventricular angiography is carried out using a right anterior oblique projection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Coronary artery dissection is usually followed by cardiac arrest.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">65<\/div><div class=\"stem\">Regarding isotope bone scanning:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It is a highly specific investigation.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 99mTc methylene diphosphonate (MDP) remains stable for 48 hours.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 20% of the injected 99mTc MDP localises in bone.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> To ensure adequate counts the patient should not pass urine between the isotope injection and imaging the static phase.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The blood pool phase should be imaged approximately 15 minutes after injection.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The bone scan is highly sensitive but non-specific as any lesion in bone (e.g. fracture, infection, tumour or<br>healing bone) will show as an area of increased activity.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Preparation involves reduction of the pertechnetate ion. After 6 hours this may reoxidise back to free<br>pertechnetate which would localise in the thyroid and the stomach and thus degrade the scan.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - The remainder is excreted by the kidneys.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The patient should be encouraged to drink plenty of fluid and to empty the bladder regularly so as to<br>reduce the radiation dose to the bladder.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The blood pool phase should be imaged 1 to 2 minutes post injection, the blood flow phase and the static<br>phase should be imaged in the first 30 seconds and at 3-4 hours respectively.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">66<\/div><div class=\"stem\">Regarding isotope examinations of the thyroid and parathyroid glands:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 131l is the most frequently used agent for examination of the thyroid.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 123I has a half-life of 13 hours.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Prior use of an intravenous non-ionic contrast medium will result in poor uptake of the isotope within the thyroid gland<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The thyroid images should be obtained with a converging collimator.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The parathyroids are imaged via a subtraction technique, subtracting the 201TI image from the 99mTc image.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - 131l is used mainly in the study of metastatic thyroid cancer. It is not used for routine thyroid imaging due<br>to the high radiation dose from beta-emission. The most frequently used agents are 123l and 99mTc<br>pertechnetate.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - 131I has a half-life of 8 days.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Uptake of either 99mTc pertechnetate or iodine is inhibited by recent high ingestion of iodine.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This gives high resolution images. Note that this is at the expense of increased imaging time and some<br>degree of image distortion.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - 201TI is taken up by the thyroid and parathyroid glands. 99mTc is taken up by the thyroid gland only.<br>Parathyroid images are therefore obtained by subtracting the 99mTc image from the 201TI image.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">67<\/div><div class=\"stem\">Regarding the radiopharmaceuticals used for lung ventilation studies:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> When using ,133Xe a single breath technique is employed.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> When using l27Xe, the ventilation study must be performed prior to the perfusion study.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A krypton ventilation study can be performed simultaneously with the perfusion study.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> When using krypton, lateral oblique views should be avoided because of the confusion caused by overlap of two lungs.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Ideally, 99mTc DTPA aerosols should not be used in patients with chronic airways disease.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Because of the high radiation dose, a single breath technique is employed. Images are taken in one position<br>only (usually posterior). The images obtained are in inspiration, equilibrium and in two washout phases.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - When using 133Xe, the ventilation study must be performed first otherwise image quality would be<br>compromised by scattered radiation from the higher energy 99mTc gamma rays used for the perfusion<br>scan. 127Xe emits gamma rays with higher energy than 133Xe and 99mTc and so can be used to perform<br>a ventilation study after a perfusion scan.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - If dual energy data acquisition is performed; as krypton emits gamma rays with an energy of 190 keV and<br>99mTc emits gamma rays with an energy of 140 keV.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - In a krypton ventilation study, six views of the lungs should be obtained: anterior; posterior; RPO; LPO;<br>right lateral; and left lateral.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Aerosols clump and therefore cause focal areas of increased uptake in patients with chronic airways disease.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">68<\/div><div class=\"stem\">Regarding perfusion isotope lung imaging:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It should be performed after a ventilation scan in order to diagnose pulmonary embolism.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The patient should be imaged in the supine position to maximize visualization of the lung apices.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The 99mTc-macroaggregated albumin particles occlude less than 0.5% of the total capillary bed of the lung.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The syringe should not be shaken before the injection as this may damage the albumin macroaggregates.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Respiratory failure may be induced in patients with pulmonary hypertension.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - A normal perfusion scan will exclude a diagnosis of pulmonary embolism. A perfusion scan should therefore be<br>performed first, and the ventilation scan only needs to be done if the perfusion scan is abnormal.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Imaging should be performed in the sitting position. The injection should be given with the patient supine.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - The bronchial circulation maintains pulmonary nutrition so there is no irreversible tissue damage.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The syringe should be shaken so as to prevent particles settling, as this would cause clumping on the image.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - A slow injection should be given in patients with pulmonary hypertension, and microspheres should be<br>used whenever possible. Perfusion scanning is contraindicated in patients with right to left cardiac shunts<br>due to the possibility of systemic microemboli.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">69<\/div><div class=\"stem\">Regarding isotope examinations of the urinary tract:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 99mTc DMSA has specific affinity for the proximal convoluted tubular tissue.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 99mTc DTPA is excreted by glomerular filtration.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 99mTc DMSA is never used to obtain a renogram curve.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The peak of the renogram should occur at 3-5 minutes.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> 99mTc MAG-3 is excreted by glomerular filtration.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - 99mTc DMSA is bound to plasma proteins and is cleared from the blood by renal tubular absorption.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - When injected intravenously, 99mTc DTPA is distributed throughout the extracellular space. It is excreted<br>rapidly from the body by glomerular filtration.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - 99mTc DMSA is used only for static renal imaging. 99mTc MAG-3 and 99mTc DTPA are the commonest<br>radiopharmaceuticals used to obtain a renogram.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - The normal renogram comprises three phases: the vascular phase, the secretory phase and the excretory<br>phase. The peak of the renogram occurs at 3-5 minutes post injection, and it takes 10-15 minutes for the<br>activity to drop to half its peak value (the clearance half-time).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - 99mTc MAG-3 is excreted by tubular secretion and has an extraction efficiency three times greater than<br>99mTc DTPA.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">70<\/div><div class=\"stem\">Regarding radionuclide investigation of the gastrointestinal tract:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Patient preparation is not required for a radionuclide Meckel's diverticulum scan.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Gastrointestinal bleeding will only be detected if the rate of blood loss is greater than approximately 0.5 ml/min.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A recent barium study may mask a bleeding site.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Gastro-oesophageal reflux may be demonstrated with 99mTc Sulphur colloid.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A full bladder is encouraged in a Meckel’s scan in order to elevate and separate small bowel loops.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Nil by mouth for 6 hours unless it is an emergency. Prior administration of an H2 blocker or pentagastrin is<br>also advised so as to enhance detection by increasing the uptake of 99mTc pertechnetate into gastric<br>mucosa and inhibiting its release into the lumen of the stomach or bowel.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Barium causes significant attenuation of gamma photons and may mask a bleeding site.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - In adults, orange juice labelled with 99mTc colloid may be used to demonstrate reflux, and in young<br>children a normal milk feed may be similarly labelled.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The bladder should be empty. A full bladder may obscure the Meckel's diverticulum.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">71<\/div><div class=\"stem\">Regarding cardiovascular radionuclide imaging investigations:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Red cells are labelled with chromium ions.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Multiple gated acquisition (MUGA) may not be possible if the patient is in atrial fibrillation.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 201TI is taken up by skeletal muscle.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Methoxy isobutyl isonitrile (MIBI) is excreted via the hepatobiliary route.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> In MI imaging with 99mTc pyrophosphate, infarcts show tracer uptake from 24 hours and do so for up to 10 days.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Red cells are labelled with 99mTc pertechnetate, but before this they are primed with an injection of<br>stannous ions. The stannous ions reduce the pertechnetate and allow it to bind to the red blood cells.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - If the patient has an arrhythmia, the computer cannot identify an acquisition cycle.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Distribution of thallium is related to blood flow and metabolism. It is mainly taken up by muscle and<br>thyroid, but some uptake occurs in the liver, spleen and kidney. It is used for myocardial perfusion<br>imaging.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - The gall bladder may therefore appear as an area of increased tracer uptake on a 99mTc MIBI scan. A drink<br>of milk or a fatty meal 30-60 minutes after injection helps to clear the radiopharmaceutical from the liver<br>and gall bladder so that myocardial perfusion can be imaged.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - The size and intensity of myocardial uptake is related to infarct size.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">72<\/div><div class=\"stem\">The following statements are correct:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> In 67Ga scintigraphy uptake within the bowel is often a normal feature.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> 99mTc tin colloid is taken up in the liver by the hepatocytes.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> In colloid scintigraphy, focal liver disease may be mimicked by overlying breast tissue.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> In normal cholescintigraphy, the gall bladder should be visualised by 1 hour.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Tricyclic antidepressants should be stopped prior to a radioiodine M-iodobenzylguanidine (MIBG) scan for<br>phaeochromocytoma.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Bowel activity is prominent up to 72 hours and is one of the main drawbacks of 67Ga imaging for<br>abdominal infection. Delayed imaging is essential.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Radiolabelled colloids are taken up by the Kupffer cells in the liver.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - There is considerable variation in normal liver appearances. For example, focal abnormalities can also be<br>mimicked by rib impressions, hepatic veins, and the impression of the right kidney.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - 99mTc N-substituted iminodiacetic acid (HIDA) is taken up by hepatocytes and secreted into the bile in the<br>same way as is bilirubin. By one hour the gall bladder is normally visualised.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Tricyclic antidepressants block MIBG uptake, as does reserpine, labetalol and cocaine. The thyroid should<br>be blocked before MIBG scanning with potassium perchlorate or Lugol's iodine.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">73<\/div><div class=\"stem\">In ultrasound of the upper abdomen:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The spiral valve of the cystic duct will frequently produce an acoustic shadow.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Assessment of gall bladder wall thickness is preferably carried out after a fatty meal.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Reflectivity of the normal liver parenchyma is slightly higher than that of the normal renal cortex.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> An intercostal approach is optimal for examining the adrenal glands.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Hepatic veins have highly reflective walls.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - This should not be mistaken for a stone in the cystic duct.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The normal gall bladder is contracted and thick-walled after a fatty meal. These appearances cannot be<br>distinguished from pathological contraction. Therefore, gall bladder wall measurements should only be<br>carried out in the fasting state, when wall thickness is normally less than 3 mm.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Reflectivity of the normal liver parenchyma is also slightly higher than that of the spleen.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Hepatic veins have poorly reflective walls. Portal veins have highly reflective walls.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">74<\/div><div class=\"stem\">In ultrasound of the pancreas:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The pancreatic duct cannot normally be visualized.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> An oral fluid load may be helpful.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The pancreas is more frequently visualized with the patient erect than in any other position.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The normal pancreas is homogeneous with a reflectivity greater than or equal to that of the liver.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The maximum anteroposterior (AP) diameter of the normal pancreatic head is 15 mm.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The pancreatic duct can normally be visualised in almost 90% of patients. Its maximum diameter, in the<br>region of the pancreatic body, is up to 2 mm in patients under 60 years of age. The calibre of the<br>pancreatic duct increases with age.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - This produces an acoustic window through the stomach. This helps to visualise the pancreatic body and<br>tail when the patient is turned onto their left side, and the pancreatic head and uncinate process when<br>the patient is turned onto their right side.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Variations in the level of reflectivity of the pancreas probably relate to the degree of fat content; this<br>commonly increases after 60 years of age.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The maximum AP diameter of the pancreatic head is 25 mm. The pancreatic body has a maximum AP<br>diameter of 15 mm.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">75<\/div><div class=\"stem\">Regarding urinary tract ultrasound:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The renal sinus is normally echogenic.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Renal lengths are preferably measured in the anteroposterior plane for standardization.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Maternal collecting system dilatation does not normally occur before the third trimester of pregnancy.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The full bladder appears rectangular-shaped in transverse section.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A jet of urine entering the bladder is commonly observed.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Due to fat surrounding the renal collecting system and blood vessels. This reflectivity is reduced in neonates.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Renal lengths are measured by rotating the probe around the long axis of the kidney and recording its<br>longest length.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Mild collecting system dilatation occurs as early as 12 weeks gestation. This increases throughout<br>pregnancy until term, when dilatation is usually more marked on the right side. Following delivery, the<br>dilatation decreases but may persist for at least 3 months.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Due to the effect of normal ureteric peristalsis.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">76<\/div><div class=\"stem\">In ultrasound scanning of the testes:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A 3.5 MHz transducer frequency is recommended,<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A water bath is not useful.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The normal testis is heterogeneous in texture.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The mediastinum testis is seen as a thin reflective band lying longitudinally.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The head of the epididymis is of similar reflectivity to the testicular tissue.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - A high resolution transducer in the frequency range 7.5-10 MHz is desirable.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - A water bath clears the organ being examined from near field interference and ensures that the organ lies<br>within the focal zone of the transducer.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The normal testis is acoustically homogeneous. It is of medium reflectivity.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - It is a normal structure representing condensations of connective tissue within the testicular stroma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - But the rest of the epididymis is less reflective than testicular tissue.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">77<\/div><div class=\"stem\">7.5 MHz frequency transducer is suitable for scanning the:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Orbit.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Thyroid.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Salivary glands.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Breast<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Neonatal hip.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">78<\/div><div class=\"stem\">In normal neonatal ultrasound:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The pancreas is markedly echogenic.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The neonatal adrenal gland is more easily visualized than that of the adult.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The renal pyramids appear prominent.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A 3.5 MHz linear array transducer is preferred when scanning the brain.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The tri-radiate cartilage cannot be identified.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The pancreas is echopoor in neonates.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - For several reasons: the neonatal adrenal gland is proportionally larger; there is less neonatal perirenal fat;<br>and higher frequency transducers are used, improving resolution. The normal adrenal cortex appears<br>echopoor and the medulla echogenic.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - The renal pyramids are large and echopoor compared with the thin echogenic cortex. These neonatal<br>appearances alter between 2 and 6 months of age when the adult pattern emerges.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - A 5-7.5 MHz sector transducer should be used.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The tri-radiate cartilage is seen as an echopoor area between the bony ilium and ischium. Ultrasound of<br>the neonatal hip is successfully carried out using the cartilaginous femoral head as an acoustic window<br>into the acetabulum.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">79<\/div><div class=\"stem\">In ultrasound of the neonatal brain:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The anterior fontanelle is preferentially used as a window for scanning.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The choroid plexus is highly echogenic.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The corpus callosum is echopoor.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The cavum septum pellucidum can be visualised in about 95% of full-term infants.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A 7.5 MHz linear array transducer is ideal.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - The posterior fontanelle and temporo-parietal bone can also be used.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The cavum septum pellucidum can be visualised in about 50% of all full-term infants. By 6 months of age,<br>its incidence is similar to that reported in adults (15-20%).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - This technique requires a sector transducer. A linear array transducer has a long rectangular scan head<br>and a field of view which is unsuitable for visualisation of the whole brain through a small acoustic<br>window.<\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">80<\/div><div class=\"stem\">In endoscopic ultrasound examination of the oesophagus:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Patient preparation should include drinking at least 1 I of fluid.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The heart valves can be identified.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Manometry is carried out as part of the procedure.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> PH monitoring is part of the procedure.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> All the layers of the oesophageal wall can be identified<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The ultrasound probe is attached to a rubber bag containing water so that acoustic contact can be<br>maintained between the oesophageal wall and probe.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Identification of the heart valves helps to define local anatomy.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Endoscopic ultrasound defines anatomy rather than function. Manometry requires a perfused multilumen<br>tube.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - pH monitoring requires a pH probe to be positioned in the lower oesophagus for 24-hour monitoring.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 9","front":"<div class=\"number\">62<\/div><div class=\"stem\">The following statements are true of vascular interventional techniques:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Prior to balloon dilatation of a leg vessel, the guidewire must be removed.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> iliac arteries are preferably dilated antegradely from a femoral puncture on the side opposite the lesion.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Heparin should not be given during angioplasty due to the increased risk of haematoma formation.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Following an embolisation procedure, the patient may have a fever for up to 10 days.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Embolic material should always be radiopaque.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Dilatation should be performed with the guidewire remaining across the stenosis/occlusion until the<br>procedure is completed.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Iliac arteries are preferably dilated retrogradely via an ipsilateral puncture.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The patient should be anticoagulated during an angioplasty procedure using 3000-5000 units of heparin.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Post-embolisation syndrome comprises fever, pain, leucocytosis and a general feeling of being unwell. It<br>should only be diagnosed when other treatable causes of the patient's condition (e.g. infection) have been<br>excluded.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Non-opaque emboli should always be injected as a suspension in contrast medium so that they are visible<br>as filling defects during the injection sequence.<\/div>","due":39},{"section":"Exam 9","front":"<div class=\"number\">63<\/div><div class=\"stem\">The ideal radiopharmaceutical should:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Have a half-life that is approximately four times the length of the scintigraphic examination<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Emit mainly charged particle emissions.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Produce emissions with an energy between 80 keV and 300 keV.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Localize only in the area of interest.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Be mono-energetic.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The half-life should be of a similar length to the duration of the examination.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The radionuclide should emit gamma rays and there should be no charged particle emissions (i.e. alpha<br>and beta emissions) as these increase radiation dose without contributing to image quality.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - This ensures that the emissions penetrate tissue, but will be stopped by the detector.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":39},{"section":"Exam 9","front":"<div class=\"number\">64<\/div><div class=\"stem\">Regarding isotope brain scanning:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 99mTc HMPAO does not cross the blood-brain barrier.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span>
