<script>
const cards=[{"section":"Exam 6","front":"<div class=\"number\">1<\/div><div class=\"stem\">Regarding conventional high-osmolar contrast media:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> their viscosity at 20°C is approximately half that at 37°C.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the use of meglumine salts, as against sodium salts, is preferred for intravenous urography.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the incidence of severe adverse reactions to intra-arterial injections is about one third of those following intravenous injections.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> their osmolality is five to eight times the physiological osmolarity of plasma.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> anaphylactoid reactions are usually dose-dependent.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Viscosity at 20°C is about twice that at 37°C.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Meglumine salts have a strong diuretic effect which therefore reduces the urinary iodine concentration in intravenous urography. The use of sodium salts is preferred. Sodium salts produce denser pyelograms.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - The osmolality of low-osmolar contrast media is about one third the osmolality of conventional ionic contrast media, but still twice the physiological osmolarity of plasma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Anaphylactoid reactions are rarely dose-dependent. Hyperosmolar adverse reactions are dose-dependent.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">2<\/div><div class=\"stem\">The following contrast medium agents are low-osmolar non-ionic monomers:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> meglumine ioglycamate (Biligram).<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> iothalamate (Conray).<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> iopamidol (Niopam).<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> meglumine and sodium ioxaglate (Hexabrix).<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Iotrolan.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - This is a low-osmolar bi-acidic dimer with an iodine:particle ratio of 6:3. It may be used for intravenous cholangiography.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - This is a conventional high-osmolar ionic monomer with an iodine:particle ratio of 3:2.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - A non-ionic monomer has an iodine:particle ratio of 3:1.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - This is a low-osmolar mono-acid dimer with an iodine:particle ratio of 6:2.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - This is a low-osmolar non-ionic dimer with an iodine:particle ratio of 6:1.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">3<\/div><div class=\"stem\">The following should routinely receive low-osmolar contrast media (LOCM) rather than<br>conventional high osmolar contrast media (HOCM):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Patients with renal failure.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Infants and elderly.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Poorly hydrated patients.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Patients with myelomatosis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Patients with strong history of allergy.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - These groups are at increased risk of the adverse hyperosmolar effects of contrast media.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - And also those with a history of severe contrast medium reaction. Both groups are at increased risk of the<br>anaphylactoid effect of contrast media.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">4<\/div><div class=\"stem\">Regarding contrast media:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The adverse reaction rate of intravenous low osmolar Contrast media is about one fifth that of intravenous<br>conventional high-osmolar contrast media.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The urographic nephrogram is Produced by contrast medium in the renal arterioles.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Physical or emotional stress increases a patient's susceptibility to an adverse reaction (following intravenous injection).<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Gastrografin is indicated when attempting to demonstrate a tracheo-oesophageal fistula in an infant.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> High-viscosity low-density barium should be used in double-contrast barium meal examinations.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - The quoted adverse reaction rate of conventional high-osmolar contrast media is about 5.8%.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The urographic nephrogram is produced by filtered contrast medium in the lumen of the tubules, mainly<br>the proximal convoluted tubules.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Gastrografin is contraindicated because it is hyperosmolar and may cause pneumonitis and/or acute<br>pulmonary oedema if aspirated. It may also cause dehydration by its hyperosmolar effect in the small<br>intestine. Dilute barium or a low-osmolar non-ionic contrast medium should be used.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Low-viscosity high-density barium should be used.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">5<\/div><div class=\"stem\">Regarding the management of possible adverse reactions to Intravenous contrast media:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Intravenous metoclopramide should be given for nausea.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Intravenous chlorpheniramine maleate (Piriton) is indicated in severe generalised urticaria.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Intramuscular adrenaline 0.5-1 mg is a first-line drug to be used in the treatment of anaphylactoid shock.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Corticosteroid prophylaxis is mandatory in asthmatic patients.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Raising the patient’s feet has no value in contrast-induced hypotension.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Confident reassurance alone is usually adequate. Intravenous antiemetics are rarely necessary.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - This is an antihistamine. Intravenous corticosteroids should also be given.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Intravenous fluids, antihistamines, corticosteroids and nebulised beta-2-agonists may also be necessary.<br>ECG monitoring, oximetry and blood pressure monitoring should also be carried out.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The value of corticosteroid prophylaxis remains unproven and controversial.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Simple manoeuvres alone may be effective in vasovagal syncope.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">6<\/div><div class=\"stem\">When using lignocaine as a local anaesthetic:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> 20 ml of a1% solution is the maximum safe dose in adults.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> It is effectively absorbed from mucous membranes.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Convulsions are a recognized complication of toxicity.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> There is an increased risk of lignocaine toxicity in patients on cimetidine.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> It is contraindicated for use in acute porphyria.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - The maximum safe dose of lignocaine for local anaesthesia is 200 mg.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Other side effects include agitation, euphoria, nausea, pallor, sweating and respiratory depression.<br>Lignocaine toxicity can also cause hypotension, bradycardia and cardiac arrest.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Cimetidine inhibits the metabolism of lignocaine, thus increasing the risk of toxicity.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Lignocaine may induce acute porphyric crises. It is also contraindicated in hypovolaemia and complete heart block<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">7<\/div><div class=\"stem\">Regarding local anesthesia in radiology:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Paraesthesiae and sweating are early signs of lignocaine overdose.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Adrenaline should always be added to lignocaine to prolong its local anesthetic effect.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Lignocaine is a constitute of Emla cream.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Procaine is recommended in order to anaesthetist the pharynx prior to passage of tube during enteroclysis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Respiratory depression as a result of lignocaine overdose may be reversed by naloxone.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - In addition to pallor, speech disturbance, tremor and auditory hallucinations. These may progress to<br>central nervous system and cardiovascular depression.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Adrenaline, a vasoconstrictor, should not be added to lignocaine when used as a local anaesthetic in<br>appendages or digits as it may produce ischaemic necrosis.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Emla cream consists of a combination of lignocaine and another local anaesthetic agent. It is often used<br>topically in children when it should be applied to the skin under an occlusive dressing 1-5 hours before any<br>procedure.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Procaine, a local anaesthetic, is poorly absorbed from mucous membranes. It is of no value as a surface<br>anaesthetic. Lignocaine spray, which is well absorbed from mucous membranes, is used instead.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Naloxone reverses respiratory depression caused by opioid analgesics. Respiratory depression caused by<br>lignocaine overdose must be managed by supportive measures as there is no specific antagonist<br>available.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">8<\/div><div class=\"stem\">Regarding pharmacological agents used in gastrointestinal radiology:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Glucagon is a more potent smooth muscle relaxant than hyoscine butylbromide (Buscopan)<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Hyoscine butylbromide (Buscopan) may cause acute gastric dilatation<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Glucagon is contraindicated in diabetic patients.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Metoclopramide increases small bowel transit time.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> With metoclopramide, extrapyramidal effect are more likely to occur in children than in adults.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - A rare complication due to its anticholinergic action.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Glucagon is contraindicated in patients with either a phaeochromocytoma or an insulinoma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Metoclopramide increases gastric peristalsis thus reducing small bowel transit time.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Extrapyramidal side effects may occur if the dose exceeds 0.5 mg/kg.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">9<\/div><div class=\"stem\">The following statements are true:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Intravenous glucagon contraindicated in glaucoma.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Intravenous glucagon is contraindicated in patients with phaeochromocytoma.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Tachycardia is a recognised side effect of intravenous hyoscine butylbromide (Buscopan).<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Metoclopramide (Maxolon) decreases gastric emptying time.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Metoclopramide (Maxolon) is contraindicated in patients with phaeochromocytoma.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Intravenous Buscopan is contraindicated in closed-angle glaucoma due to its mydriatic action. Intravenous<br>glucagon can be safely used as an alternative smooth muscle relaxant in this situation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Glucagon administration in phaeochromocytoma may cause tumour release of catecholamines, resulting<br>in sudden and marked hypertension. Other contraindications to glucagon are previous hypersensitivity<br>reactions and known or suspected insulinoma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Other anticholinergic side effects include blurring of vision, dry mouth and urinary retention.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This effect enhances the transit of barium during a follow-through examination.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Maxolon administration in phaeochromocytoma may induce an acute hypertensive response.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">10<\/div><div class=\"stem\">Regarding contrast media in the examination of the gastrointestinal tract:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Barium with a density of 250% w/v is ideal for a barium follow-through.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Gastrografin may be used in the treatment of meconium ileus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Barium may be used if aspiration is a possibility.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Intraperitoneal barium has a mortality rate of approximately 50%.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Solution of 150 ml Gastrografin in 1L of a flavoured drink is recommended to opacify the bowel prior to a CT exam.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Barium with a density of 250% w/v is suitable for a double-contrast barium meal, 100% w/v barium is<br>recommended for a barium follow-through, and 125% w/v is suitable for a barium enema.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The hypertonic Gastrografin draws water into the bowel, helping to dislodge the meconium. A diagnostic<br>barium enema must be performed first.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - When contrast media is likely to enter the lungs, either barium or a low-osmolar contrast medium should<br>be used. Aspiration of Gastrografin causes pulmonary oedema.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Even with treatment, there is still a 50% mortality rate if barium leaks into the peritoneal cavity. If<br>perforation is suspected, water-soluble contrast should be used.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - A solution of 15 ml of Gastrografin in one litre is recommended. This dilution minimises artefacts arising<br>from the contrast medium.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">11<\/div><div class=\"stem\">A barium swallow:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Provides better mucosal detail than does a Gastrografin swallow.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Should be performed with the patient prone when assessing oesophageal motility.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Is preferred to a Gastrografin swallow in suspected aspiration.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Requires high density (250% w/v) barium when a single contrast examination is carried out.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Should preferably be performed using a double-contrast technique when studying motility.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Water-soluble contrast media, such as Gastrografin, give relatively poor mucosal detail.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span>- Aspiration of Gastrografin causes a chemical pneumonitis and acute pulmonary oedema; it is therefore<br>contraindicated in suspected aspiration. Aspirated barium is usually coughed up without any sequelae.<br>Smaller volumes can be expectorated by physiotherapy, but larger volumes can give rise to severe<br>respiratory embarrassment. Non-ionic contrast media can be used safely in any situation where there is<br>likely to be aspiration or extravasation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - For a single-contrast study, a medium-density (100% w/v), low-viscosity barium is indicated.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - A single-contrast study is used when looking for oesophageal dysmotility, compression or displacement.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">12<\/div><div class=\"stem\">When performing a barium meal:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The patient should be advised not to smoke on the day of the examination.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Complete large bowel obstruction is a contraindication.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Approximately 1000 ml of gas should be produced in the stomach for a satisfactory double contrast study.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The RAO film demonstrates the lesser curve en face.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The prone position should be adopted when attempting to demonstrate the anterior wall of the duodenum.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Smoking causes increased gastric motility.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - 200-400 ml is an adequate volume of gas.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The RAO film demonstrates the antrum and greater curve. The LAO film demonstrates the lesser curve en face.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">13<\/div><div class=\"stem\">During a double-contrast barium meal examination:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A supine patient position is optimal for demonstrating the fundus of the stomach.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Effervescent granules with good bubble formation should be used.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Administration of hyoscine butylbromide (Buscopan) significantly affects the incidence of demonstrable gastrooesophageal reflux.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Filling of the duodenal bulb with barium occurs more reliably with glucagon than (Buscopan).<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The areae gastricae are usually best seen on an erect film.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - It demonstrates the antrum and body of the stomach.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The ideal gas producing agent should have no bubble production, adequate gas production (200-400 ml),<br>non-interference with barium coating and rapid dissolution with no residue. It should also be cheap and<br>easy to swallow.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Filling of the duodenal bulb with barium occurs more reliably with Buscopan because it relaxes the<br>pylorus.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - They are best seen on the supine films.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">14<\/div><div class=\"stem\">For a small bowel barium follow-through examination:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The patient should be advised to empty their bladder prior to the examination.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Gastrografin added to the barium is recognised as a means of reducing small bowel transit time.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A suitable volume of barium to give a child is 15 ml/kg body weight.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Serial supine abdominal radiographs should be token after the barium has been ingested.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> A pneumo-colon technique is a recognised method of producing improved visualisation of the terminal ileum.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - A full bladder helps to raise the loops of small bowel out of the pelvis.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Approximately 10 ml Gastrografin should be added to the barium in order to achieve this effect.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - In children, 3-4 ml/kg body weight is a suitable volume of barium.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Prone films should be taken because the compression of the abdomen helps to separate the loops of<br>small bowel.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Reflux of air from the colon into the terminal ileum will aid visualisation in many patients.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">15<\/div><div class=\"stem\">Regarding enteroclysis:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It is contraindicated in suspected small bowel obstruction.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> To advance the catheter through the pylorus, it may be helpful to turn the patient onto their left side.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The catheter tip should ideally be positioned 5-10 cm beyond the ligament of Treitz.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Barium should be infused at a rate of approximately 75 ml/min.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The procedure may be complicated by inducing a paralytic ileus.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Enteroclysis is not contraindicated in suspected small bowel obstruction. Barium will be diluted by the<br>small intestinal fluid thus avoiding impaction.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - When on the left side, air collects in the antrum and duodenal bulb, and may encourage the tube to move<br>towards the duodenum.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - If the tip of the tube is in the jejunum then the risk of reflux of barium into the stomach is minimised.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Too fast an infusion of barium may distend and paralyse the jejunum, resulting in delayed filling of ileal loops.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">16<\/div><div class=\"stem\">Regarding a barium enema examination:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The procedure should not be performed within 4 weeks of a full thickness rectal biopsy.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Toxic megacolon is an absolute contraindication.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A 15% w/v barium suspension is recommended for a single contrast barium enema.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A Hampton's view (prone angled view of the sigmoid) is taken with the tube angled 30° cephalad.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Perforation as a complication occurs in one in 1000 examinations.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - In general a 7 day interval after a rectal biopsy allows the mucosa to grow over the biopsy site and thus<br>minimises the risk of perforation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The friability of the colon in toxic megacolon renders it very susceptible to perforation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - On the other hand a 125% w/v barium suspension is recommended for a double-contrast enema.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The tube should be angled 30° caudally with the patient prone. This view helps to visualise the rectosigmoid.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Perforation is the commonest serious complication of the barium enema. Its incidence is quoted at one in 12000.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">17<\/div><div class=\"stem\">With respect to a double-contrast barium enema examination:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> If to be performed within 3 days of a small bowel barium examination, the barium enema should be performed first.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A patient with a prosthetic heart valve should be given antibiotic prophylaxis.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The transverse colon is usually barium-filled in the supine position.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Ileal reflux of barium is minimised if air insufflation is performed with the patient supine.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Ileal reflux is increased when intravenous hyoscine butylbromide (Buscopan) is used.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The small bowel and stomach should be examined first as they will be clear of barium after a few hours,<br>and the preparation for the enema will then remove the residual barium from the colon.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - Transient bacteraemia may occur during a barium enema.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - On a supine film the transverse colon is usually seen in good double-contrast. On a prone film the<br>transverse colon is seen filled with barium as it is then dependent.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The ileocaecal valve is most commonly on the posteromedial wall of the caecum, and is therefore<br>dependent in the supine position, making reflux of barium into the ileum likely.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Intravenous smooth muscle relaxants increase the likelihood of ileal reflux.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">18<\/div><div class=\"stem\">Regarding examination of the gastrointestinal tract in children:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Barium investigation of a tracheo-oesophageal fistula should be performed with the patient supine.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Reduction of intussusception should not be attempted radiologically if the symptoms have been present for over 24<br>hrs.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The exploratory grid should be removed when screening infants under 1 year of age.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> When examining for gastro-oesophageal reflux the baby should be placed in the prone oblique position.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> For barium reduction of intussusception, barium should be raised 100 cm above table for 5 min., a maximum of 3 times.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The baby should be positioned prone to visualise contrast passing from the oesophagus into the trachea.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The contraindications to radiological reduction are the presence of peritonitis, perforation or advanced<br>intestinal obstruction. Duration of the symptoms per se is not a contraindication.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - By removing the grid, the radiation dose can be reduced by as much as 50%. Acceptable images will be<br>obtained as there is little scatter.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Reflux is also best sought during episodes of crying.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - If after this the intussusception has not reduced, it is considered radiologically irreducible.<\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">19<\/div><div class=\"stem\">With respect to sinography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The catheter should be inserted to a maximum distance of 3 cm into the sinus track.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Water-soluble contrast medium should be used.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A maximum of 20 ml of contrast medium should be injected.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> A radiopaque marker should be placed next to the opening of the sinus.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Sinography performed during CT rarely demonstrates a more extensive track system than on conventional fluoroscopy.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - The catheter should be inserted as far as possible into the sinus track until resistance is felt. This should<br>ensure optimum filling during injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The amount of contrast medium depends on the track system. If there is clinical evidence of a fistula,<br>contrast should be injected until either reflux occurs or the fistula is shown.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This allows the orifice to be identified easily on all films, irrespective of the angle at which the film is taken.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><\/div>","due":38},{"section":"Exam 6","front":"<div class=\"number\">20<\/div><div class=\"stem\">Regarding biliary contrast media:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Intravenous agents are actively excreted into the bile by hepatocytes.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> They are concentrated in the normal gall bladder.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> They bind to serum albumin.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> An infusion technique for intravenous agents is preferable to bolus injection.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> They are contraindicated in pregnancy.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Oral agents are conjugated with glucuronic acid by hepatocytes to form conjugates which are more water-soluble<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Infusion of intravenous agents, rather than a bolus injection, results in an optimum plasma concentration<br>with maximum biliary excretion and produces fewer side effects.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - They are also contraindicated in combined hepatic and renal failure, and when there is a history of iodine<br>hypersensitivity.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">21<\/div><div class=\"stem\">Regarding oral cholecystography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It may be useful in the diagnosis of acute cholecystitis.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The cystic duct and common bile duct are rarely visualised.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A fat-containing meal should be taken on the evening prior to the examination.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> When a single dose technique is utilised, the cholecystographic agent should be taken approximately one hour<br>before attempts are made to visualise the gall bladder.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Tomography to show the gall bladder is usually necessary.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Acute cholecystitis is a contraindication to oral cholecystography as the gall bladder will not opacify.<br>Other contraindications include hepatorenal failure, dehydration, an IV cholangiogram within the previous<br>week and previous cholecystectomy.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - This empties the gall bladder and allows better subsequent filling.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The cholecystographic agent should be taken 14 hours prior to the appointment time. The control film<br>must therefore be taken when the patient makes his/her appointment, as the gall bladder will already be<br>opacified when the patient arrives for the investigation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Tomography is often utilised in intravenous cholangiography.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">22<\/div><div class=\"stem\">Regarding intravenous cholangiography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Visualisation of the biliary tree may be inadequate in up to approximately 45% of examinations in patients with<br>normal hepatic function.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> It is contraindicated in patients who have had a previous cholecystectomy.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> If the contrast medium is infused too quickly, renal rather than biliary excretion may occur.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Intravenous glucagon may improve visualisation of the common bile duct.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The mortality rate is approximately 1 in 5000 examinations.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Intravenous cholangiography may provide useful information in post cholecystectomy patients with<br>recurrent symptoms of biliary tract disease.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - An infusion of Biligram over 60 minutes (3-4 mg/kg/min) gives optimum plasma concentration with<br>maximum biliary excretion. If it is infused too quickly, there is insufficient time for albumin binding, so<br>renal excretion may occur.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - It achieves this by three mechanisms: (1) contraction of the sphincter of Oddi, followed by relaxation;<br>(2) increased choleresis and (3) increased hepatic blood flow.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Other complications include impairment of liver and renal function and the precipitation of abnormal<br>paraproteins in patients with Waldenstrom's macroglobulinaemia.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">23<\/div><div class=\"stem\">Regarding post-operative (T-tube) cholangiography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The examination should be performed at about the tenth day post operatively.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A control film of the gall bladder area is required.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Cholangio-venous reflux of contrast medium can occur.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Retained calculi can be removed via the T-tube within a few days of post operative cholangiography.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Percutaneous extraction of retained biliary calculi may be complicated by pancreatitis.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - The biliary ducts absorb contrast medium and cholangiovenous reflux can occur with high injection pressures.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - When a calculus has been identified on the T-tube cholangiogram, the patient should be discharged with<br>the T-tube clamped for at least 4 weeks to allow the formation of a fistulous tract. The T-tube can then be<br>removed, and the stone extracted through the fistulous tract with a basket.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Other complications of this technique include the creation of false sinus passages, septicaemia and vagal<br>stimulation with shock.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">24<\/div><div class=\"stem\">In endoscopic retrograde cholangiopancreatography (ERCP):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The presence of a pancreatic pseudocyst is a contraindication to the procedure.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Low osmolar contrast medium with an iodine content of 150 mg/ml should be used to examine the pancreatic duct.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Intravenous Buscopan may allow easier identification of the ampulla of Vater.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> If both the biliary tree and the pancreatic duct are to be opacified, the bile duct should be cannulated first.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Hyperamylasaemia may occur in up to 70% of patients.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Other contraindications include acute pancreatitis, severe cardiorespiratory disease, and any other<br>contraindication to endoscopy.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Dilute contrast medium (150 mg/ml) should be used to examine the bile ducts to ensure calculi are not<br>obscured. A more concentrated contrast medium (240 mg/ml) should be used for pancreatic duct examination.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - Due to its choloretic action.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The pancreatic duct should be cannulated first, and the injection of contrast should be stopped as soon as<br>the lateral branches of the pancreatic duct are seen.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Asymptomatic elevation of the serum amylase is common and usually related to over-filling of the<br>pancreatic duct.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">26<\/div><div class=\"stem\">The following situations will increase risk of bacteraemia during percutaneous<br>transhepatic cholangiography (PTC):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Puncture of the portal venous radicles.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Overdistension of intrahepatic ducts.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Complete obstruction of the common bile duct.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Multiple percutaneous punctures.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Presence of cholangitis.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">TRUE<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><br>PTC should therefore be covered with prophylactic antibiotics.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">27<\/div><div class=\"stem\">Regarding the use of contrast media in intravenous urography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The recommended dose in adults is 300 mg of iodine per kg of body weight.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The recommended dose in children is approximately 1 ml of 370 contrast medium per kg of body weight.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Patients with renal failure require half the standard amount of iodine.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The density of the nephrogram is determined by the degree of hydration of the patient.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The density of the pyelogram is greater with sodium salts than with the equivalent meglumine salts for the same<br>amount of injected iodine.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Patients with renal failure require at least twice the standard amount of iodine (i.e. 600 mg iodine/kg).<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Nephrogram density is determined by the contrast medium dose, the peak plasma contrast concentration<br>and the glomerular filtration rate. It is independent of the degree of patient hydration.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Sodium salts produce less of an osmotic diuresis than meglumine salts because sodium is reabsorbed.<br>Sodium salts therefore produce denser pyelograms.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">28<\/div><div class=\"stem\">For intravenous urography, (LOCM) are recommended in preference to high-osmolar<br>media in patients with:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Diabetes mellitus.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Systemic lupus erythematosus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Sickle cell disease.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Cardiac failure.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Pulmonary emphysema.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> <\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">29<\/div><div class=\"stem\">Ureteric compression in intravenous urography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Is a recognised cause of vasovagal symptoms.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Should be applied 15 minutes after the contrast medium has been injected.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Is essential in neonates.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Is acceptable oven when there is an abdominal mass provided that the mass is not tender.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Is contraindicated if there has been recent abdominal surgery.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - When this occurs the compression should be released, and the patient placed in the head down position.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - If compression is indicated it should be applied 5 minutes post-injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Compression is not used in young infants.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The presence of an abdominal mass is an absolute contraindication to compression.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Other contraindications include renal trauma and renal obstruction.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">30<\/div><div class=\"stem\">The following techniques are recognised as assisting radiographic visualisation on an IVU:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The tube should be angled 15o cephalad to obtain a coned post-micturition bladder view.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The ingestion of a fizzy drink to aid visualisation of the kidneys.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> A prone film to aid ureteric visualisation.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> 35° anterior oblique renal views to improve delineation of the renal outline.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Tomography centred on a point halfway between the table top and the anterior abdominal wall will aid<br>visualisation of the renal outlines.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - For a coned view of the bladder the tube is angled 15° caudad. It is centred 5 cm above the pubic symphysis.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - In children a fizzy drink will produce a gas-filled stomach which acts as a window through which the<br>kidneys can be seen.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - When the patient is prone the ureters are more dependent aiding visualisation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Oblique views of the kidney should be taken as 35° posterior obliques.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - In general, the tomographic mid-point of the kidneys lies at one third the distance from the table top to<br>the anterior abdominal wall at the inferior costal margin.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">31<\/div><div class=\"stem\">Regarding retrograde pyelography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It is recognised as being useful in delineating a lesion inadequately shown on intravenous urography.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Contrast medium with an iodine concentration of 340 mg/ml should be used.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> 50 ml of contrast medium is required to delineate the pelvicalyceal system.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> In the presence of ureteric obstruction, contrast medium should be aspirated prior to withdrawal of the catheter.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Pyelo-sinus backflow is usually asymptomatic.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - A retrograde examination is a useful adjunct to an inconclusive IVU to help demonstrate the site, length<br>and lower limit of a lesion.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Dilute contrast medium (150-200 mg iodine/ml) should be used to ensure that small lesions are not obscured.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Usually 5-10 ml of contrast is needed to delineate the pelvicalyceal system. The injection should be<br>terminated if the patient complains of loin pain.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This minimises the risk of development of a chemical pyelitis or a pyonephrosis.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - Occasionally it may result in pain, fever and rigors.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">32<\/div><div class=\"stem\">Percutaneous renal puncture:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Is recognised as being a useful technique in the evaluation of renal cysts.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Is a fundamental part of the Whitaker Test.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Should be directed towards the upper pole calyces for nephrostomy tube insertion.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> May be complicated by an arteriovenous fistula in approximately 0.5% of cases.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Is contraindicated in the presence of urinary tract infection.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - If an apparently simple cyst is present together with unexplained fever, haematuria or pain, it may be<br>helpful to drain the cyst via percutaneous renal puncture. Double contrast images of the cavity should<br>then be obtained.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - The Whitaker Test is used to distinguish between an obstructed and dilated system. A catheter is introduced<br>percutaneously into the renal collecting system, and saline infused at a rate of 10 ml/min. A relative renal<br>pelvis pressure (i.e. bladder pressure subtracted from renal pressure) less than 13 cm H2O is normal.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The aim is to puncture a lower pole calyx, passing through the least depth of parenchyma to reach the<br>collecting system. This reduces the chance of vascular damage.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Percutaneous renal puncture and drainage via nephrostomy is not contraindicated in the presence of<br>obstruction and infected urine; but prophylactic antibiotics should be given.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">33<\/div><div class=\"stem\">Regarding micturating cystourethrography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Sedation should not be given.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Water soluble contrast medium with an iodine concentration of 100 - 150 mg/ml is recommended.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> To demonstrate stress incontinence erect lateral views coned to the bladder only should be taken at rest,<br>straining, and during micturition.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> In male infants, the urethra should be imaged in the anterior oblique position.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Lateral views should be taken when attempting to demonstrate vesicovaginal or rectovesical fistulae.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Young infants may need to be sedated particularly prior to catheterisation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - These lateral views should include the sacrum and the symphysis pubis. These bony landmarks are used to<br>assess bladder neck descent.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This ensures visualisation of the long axis of the urethra.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">34<\/div><div class=\"stem\">Ascending urethrography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It the examination of choice to demonstrate posterior urethral valves.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Should not be performed within 2 weeks of urethral instrumentation.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Requires about 20-40 ml water soluble contrast medium.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Is the radiographic examination of choice for demonstrating the prostatic urethra.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Is complicated by intravasation of contrast medium in approximately 5% of cases.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Posterior urethral valves may not be demonstrated on this examination, as they only fill out and obstruct<br>during micturition. Micturating cystourethrography is therefore the investigation of choice for suspected<br>posterior urethral valves. The main indications for ascending urethrography are suspected urethral<br>trauma and the assessment of a urethral stricture.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span> - This is due to the risk of intravasation of contrast medium from the mucosal damage that may have been<br>caused by recent instrumentation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - The urethra is well seen as far as the membranous portion on ascending urethrography. To demonstrate<br>the proximal prostatic urethra, a radiograph should be taken during micturition.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">35<\/div><div class=\"stem\">Regarding hysterosalpingography (HSG):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It is contraindicated if there is a history of untreated salpingitis during the preceding 6 months.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> It should be performed in the week preceding the menstrual period.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Pethidine can be helpful if given as an analgesic before the procedure.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The procedure should be terminated if venous intravasation occurs.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Pain may persist for up to 1-2 weeks after the procedure.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - HSG is contraindicated until a course of antibiotics has been given and there is clinical evidence of<br>successful treatment.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - HSG should be performed in the first week after the menstrual period.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Pethidine stimulates smooth muscle contraction, which impedes the filling of the fallopian tubes with<br>contrast medium.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span> - Venous intravasation may occur in approximately 4% of cases, but it is of little significance when water-soluble contrast media are used.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span> - It is postulated that this is due to pelvic irritation.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">36<\/div><div class=\"stem\">Regarding cavernosography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> It is a recognised procedure for investigating male erectile dysfunction.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> A needle is positioned in each corpus cavernosum to ensure bilateral opacification.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Approximately 20 ml of contrast medium is required to opacify the corpora cavernosa.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Venous thrombosis is a recognised complication.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> It is contraindicated in the presence of a proven urinary tract Infection.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Other indications are the demonstration of the extent of Peyronie's disease and the investigation of<br>priapism and penile trauma.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The corpora cavernosa on both sides are opacified from a unilateral contrast injection.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span> - 20 ml of a low-osmolar contrast medium is recommended.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Venous thrombosis can lead to priapism with impotence.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - The only contraindication is a history of hypersensitivity to contrast media.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">37<\/div><div class=\"stem\">In arthrography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> Control films are not usually recommended prior to the procedure.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Joint effusion is a contraindication because of the risk of introducing sepsis.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Negative contrast medium is absorbed from the joint within a few hours.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Delayed films may be useful in the investigation of a suspected loose body.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Adrenaline should not be added to the contrast medium.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - Control films should always be reviewed prior to the injection of contrast medium.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - Joint effusion is not a contraindication to arthrography. The effusion should be aspirated prior to contrast<br>injection in order to avoid dilution of contrast medium and bubble formation.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Negative contrast medium (air) may take up to 4 days to be completely absorbed from the joint space.<br>Positive contrast medium is absorbed within a few hours.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Adrenaline (0.1 ml of a 1:1000 solution) may be added to the contrast medium in order to delay its<br>absorption from the joint space.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">38<\/div><div class=\"stem\">Regarding shoulder arthrography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A single contrast technique is usually recommended.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> The injection site lies at the same horizontal level as the coracoid process.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> The patient lies supine with the forearm pronated to allow easy needle entry into the joint space.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> CT examination requires a smaller volume of positive contrast medium.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> An axial radiograph is routinely performed following contrast injection.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span> - A double contrast study is usually performed using about 10 ml of positive contrast medium and 10 ml of air.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - The injection site lies about 2 cm inferior and lateral to the tip of the coracoid process.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The patient lies supine with the forearm supinated and close to the body. This allows the long head of<br>biceps to rotate away from the vertical path of the needle. In addition, the articular surface of the glenoid<br>will face anteriorly avoiding damage to its labrum.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - Up to 3 ml.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">39<\/div><div class=\"stem\">In double-contrast knee arthrography:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> The needle is introduced at a point 1 cm posterior to the mid-point of the patella.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> About 15 ml of positive contrast medium is recommended.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Correct siting of the needle tip should be confirmed by aspiration of synovial fluid.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> The knee should be manipulated following contrast injection.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> Any discomfort occurring in the joint at 12 hours is abnormal.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - Either via a medial or lateral approach into the patello- femoral joint space.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span> - About 3 ml of positive contrast medium and 50 ml of air are injected.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - Correct siting of the needle tip within the joint space is confirmed by a test injection of a small volume of<br>contrast medium under fluoroscopic control. Contrast medium should flow rapidly around the joint.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - This ensures even distribution of contrast medium within the joint.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Some discomfort may occur in the joint for up to about 2 days. The patient should be warned about this.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">40<\/div><div class=\"stem\">When performing myelography of the lumbar region:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A lumbar puncture within the preceding week is a contraindication.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> Approximately 10 ml of water-soluble contrast medium with an iodine strength of 240 mg/ml should be used.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Contrast should be injected with the X-ray table tilted 15° head down.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> Routine frontal and lateral views of the lower thoracic cord are mandatory.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> The patient should lie flat for 6 hours following the procedure.<\/div>","back":"<div class=\"answer-title\">Answer<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span> - A small amount of cerebrospinal fluid often leaks into the subdural or extradural space after a lumbar<br>puncture, and if a second lumbar puncture is performed within a week of the first, the pool of leaked<br>cerebrospinal fluid may be tapped instead of the subarachnoid space.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span> - The table should be tilted 15° foot down during the injection to ensure pooling of contrast in the lumbar<br>subarachnoid space.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span> - In order to exclude unsuspected intraspinal tumours which can mimic a disc prolapse.<\/div><div class=\"ans-row tech-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span> - Following the procedure the patient should sit up so as to pool the contrast medium in the lumbosacral<br>region. The patient is then allowed to remain ambulant if he/she wishes.<\/div>","due":38},{"section":"Exam 7","front":"<div class=\"number\">25<\/div><div class=\"stem\">Regarding percutaneous transhepatic cholangiography (PTC):<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> A platelet count of less than 10
